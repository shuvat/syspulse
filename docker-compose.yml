# Shared settings for the three agents (a YAML anchor; Compose ignores x-* keys).
x-agent: &agent
  build: ./agent
  environment: &agent-env
    SERVER_HOST: server
    SERVER_PORT: "9000"
    # Measure each container's own CPU and memory (cgroup), not the whole machine
    # (/proc/stat, /proc/meminfo).
    CPU_SOURCE: cgroup
    MEM_SOURCE: cgroup
  # Each agent may use at most one CPU. The agent reports CPU % relative to this limit
  # (cgroup cpu.max), so 100% means "the container uses everything it is allowed to",
  # independent of the load from anything else on the machine.
  cpus: "1.0"
  # Same idea for memory: memory % is relative to this limit (cgroup memory.max).
  mem_limit: 256m
  depends_on:
    server:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      # Development-only credentials; the database is reachable only from localhost.
      POSTGRES_USER: syspulse
      POSTGRES_PASSWORD: syspulse
      POSTGRES_DB: syspulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syspulse -d syspulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      # Inside the Compose network the database is reached by its service name.
      DATABASE_URL: postgresql+psycopg://syspulse:syspulse@db:5432/syspulse
    ports:
      # Only the REST API is published; port 9000 (ingest) is used by the agents
      # over the internal network.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; urlopen raises (exit code 1) on a 503.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://server:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Streamlit's own health endpoint; no curl in the slim image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent-1:
    <<: *agent
    environment:
      <<: *agent-env
      AGENT_NAME: agent-1

  agent-2:
    <<: *agent
    environment:
      <<: *agent-env
      AGENT_NAME: agent-2

  agent-3:
    <<: *agent
    environment:
      <<: *agent-env
      AGENT_NAME: agent-3

volumes:
  pgdata:
