name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  cpp:
    name: C++ agent (build + ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # GoogleTest and nlohmann/json are fetched by CMake (FetchContent), so the runner's
      # g++ and cmake are all we need.
      - name: Configure
        run: cmake -S agent -B agent/build
      - name: Build
        run: cmake --build agent/build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir agent/build --output-on-failure

  server:
    name: Python server (pytest + PostgreSQL)
    runs-on: ubuntu-24.04
    # The tests use a real PostgreSQL, like locally. The service container starts before the
    # steps, and the job waits until its healthcheck passes.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syspulse
          POSTGRES_PASSWORD: syspulse
          POSTGRES_DB: syspulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syspulse -d syspulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest.py creates and uses this database.
      TEST_DATABASE_URL: postgresql+psycopg://syspulse:syspulse@localhost:5432/syspulse_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -v

  mcp-server:
    name: MCP server (pytest, mocked API)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp_server/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -v

  dashboard:
    name: Dashboard (pytest + Streamlit AppTest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -v

  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Only ruff is needed; same version as in the requirements-dev.txt files.
      - name: Install ruff
        run: pip install ruff==0.16.10
      # Config in ruff.toml at the repo root; --output-format=github shows findings
      # as annotations on the changed lines of a pull request.
      - name: Ruff
        run: ruff check --output-format=github .

  integration:
    name: Integration (Docker Compose, end to end)
    # Runs only after every other job passed: it is the slowest job, and a failure in a
    # unit job already tells us what is broken.
    needs: [cpp, server, mcp-server, dashboard, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp_server/requirements.txt
      # For step 4 of the test (a real MCP client). Docker and Compose v2 are preinstalled.
      - name: Install MCP SDK
        run: pip install -r mcp_server/requirements.txt
      - name: Integration test
        env:
          MCP_PYTHON: python
        run: ./scripts/integration_test.sh
